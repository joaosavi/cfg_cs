//DEMO
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"
bind "-" "slot11"
bind "=" "slot12"

bind "RSHIFT" "demo_togglepause" 											// pause
bind "SPACE" "+jump"														// mudar câmera
bind "RCTRL" "slot12"														// x-ray
bind "LEFTARROW" "demo_gototick -320 relative"								// volta 5 segundos na demo
bind "RIGHTARROW" "demo_gototick +320 relative"								// avanca 5 segundos na demo

bind "UPARROW" "+ffw10"														// 10x speed toggle
alias "+ffw10" "demo_timescale 10"
alias "-ffw10" "demo_timescale 1"

bind "DOWNARROW" "+ffw025"													// 0.25x speed toggle
alias "+ffw025" "demo_timescale 0.25"
alias "-ffw025" "demo_timescale 1"

tv_listen_voice_indices_h -1												// escutar voip
tv_listen_voice_indices -1