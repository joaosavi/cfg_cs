//GENERAL
con_enable "true" 															// habilita console
mm_dedicated_search_maxping "35" 											// busca servidores com até esse ping
ui_steam_overlay_notification_position "bottomright" 						// local da notificação steam
cl_teamid_overhead_mode "3" 												// deixar em 3 - setas e info na cabeça do seu time
cl_teamid_overhead_colors_show "1" 											// cores na cabeça do seu time
cl_teammate_colors_show "1" 												// cores do time no radar
cl_dm_buyrandomweapons "0"												 	// não te dá armas aleatórias no DM
cl_join_advertise "2" 														// deixa amigos entrarem nos seus servidores
cl_scoreboard_mouse_enable_binding "+attack2" 								// habilita o mouse2 na tabela de score
cl_silencer_mode "0" 														// não retira silenciador por acidente
spec_show_xray "1" 															// raio x no spec
battery_saver "0" 															// sem economia de energia
r_show_build_info "0" 														// tira informaçoes da build
hud_showtargetid 1 															// mostra nome do inimigo se mirar nele (ajuda a spotar)
cl_crosshair_friendly_warning 0 											// crosshair sem aviso de tiro amigo
cl_use_opens_buy_menu 0 													// não abre buy menu no E
fps_max "0" 																// fps maximo
fps_max_ui "0" 																// fps maximo no menu
cl_autohelp "0" 															// desabilita tutorial
r_drawtracers "1"															// liga traços de bala
cl_showloadout 1															// mostra o loadout
cl_sniper_show_inaccuracy 0                                                 // tira a mira de merda nova da AWP



// VALVE FILHA DE UMA PUTA DO CARALHO
sv_subtick_movement_view_angles 0                                           // valve quebrou bhop tem que deixar essa porra no 0 pra funcionar
engine_low_latency_sleep_after_client_tick "1" 								// pode ajudar na consistência do frametime
cl_net_buffer_ticks "0" 													// ativar pode diminuir a perda de pacote mas você terá desvantagem
net_client_steamdatagram_enable_override "0"								// Se ativar abaixa o ping mas piora packet loss
rate "1000000"                                                              // eu odeio a valve

